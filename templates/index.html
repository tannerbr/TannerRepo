<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Select an Item ID - Recommendation Lookup</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    .error { color: red; }
    select { font-size: 1em; padding: 0.2em; }
    button { font-size: 1em; padding: 0.3em 0.6em; }
  </style>
</head>
<body>
  <h1>Select an Item ID to View Recommendations</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="POST">
    <label for="item_id">Item ID:</label>
    <select name="item_id" id="item_id">
      {% for item in item_ids %}
        <option value="{{ item }}">{{ item }}</option>
      {% endfor %}
    </select>
    <button type="submit">Get Recommendations</button>
  </form>
</body>
</html>
