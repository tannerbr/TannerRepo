<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Select an Item for Recommendations</title>
  </head>
  <body>
    <h1>Select an Item for Recommendations</h1>
    <form method="post">
      <label for="item_id">Item:</label>
      <select name="item_id" id="item_id">
        {% for id, title in available_items %}
          <option value="{{ id }}">{{ title }} (ID: {{ id }})</option>
        {% endfor %}
      </select>
      <button type="submit">Get Recommendations</button>
    </form>
    {% if error %}
      <p style="color:red;">{{ error }}</p>
    {% endif %}
  </body>
</html>
